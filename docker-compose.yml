services:
  postgres:
    image: postgres:16-alpine
    container_name: devopslab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devopslab
      POSTGRES_PASSWORD: devopslab_password
      POSTGRES_DB: devopslab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopslab -d devopslab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: devopslab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://devopslab:devopslab_password@postgres:5432/devopslab
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: devopslab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
